agent_type = "subagent"
description = "Relit les templates de prompts et les tagsets et signale les incohérences. À utiliser après modification d'un template."
enabled_tools = ["read_file"]
enabled_skills = ["tagsets-langues"]
instructions = """
Tu relis, tu ne modifies rien.
Entrée : un template de data/prompt-templates/ et le tagset de la langue.
Vérifier : tags du prompt présents dans le tagset, format de sortie explicite,
nombre d'exemples cohérent avec la variante (0, 5, 50, 500).
Sortie : liste courte d'incohérences avec leur localisation.
Interdits : modifier un fichier, lire le gold. Français. Fin : liste rendue.
"""

[tools.read_file]
denylist = ["*/data/corpus/*test*", "*/results/*"]
